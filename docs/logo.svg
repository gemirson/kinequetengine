<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background for contrast in dark/light modes -->
  <defs>
    <linearGradient id="bio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Stylized DNA / Graph Icon -->
  <g transform="translate(10, 10)">
    <!-- Helix A -->
    <path d="M 20,20 Q 40,0 60,20 T 100,20" fill="none" stroke="url(#bio-grad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Helix B -->
    <path d="M 20,60 Q 40,80 60,60 T 100,60" fill="none" stroke="#E06C75" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Connector Nodes (Pheromones) -->
    <circle cx="20" cy="20" r="4" fill="#282C34" stroke="url(#bio-grad)" stroke-width="2"/>
    <circle cx="20" cy="60" r="4" fill="#282C34" stroke="#E06C75" stroke-width="2"/>
    <circle cx="40" cy="40" r="5" fill="#4CAF50"/>
    <circle cx="60" cy="20" r="4" fill="#282C34" stroke="url(#bio-grad)" stroke-width="2"/>
    <circle cx="60" cy="60" r="4" fill="#282C34" stroke="#E06C75" stroke-width="2"/>
    <circle cx="80" cy="40" r="5" fill="#E06C75"/>
    <circle cx="100" cy="20" r="4" fill="#282C34" stroke="url(#bio-grad)" stroke-width="2"/>
    <circle cx="100" cy="60" r="4" fill="#282C34" stroke="#E06C75" stroke-width="2"/>
    
    <!-- Links -->
    <line x1="40" y1="40" x2="20" y2="20" stroke="#4CAF50" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="40" y1="40" x2="20" y2="60" stroke="#4CAF50" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="80" y1="40" x2="60" y2="20" stroke="#E06C75" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="80" y1="40" x2="60" y2="60" stroke="#E06C75" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Text -->
  <text x="130" y="55" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="32" fill="#282C34">
    KineQuet<tspan fill="#4CAF50">Engine</tspan>
  </text>
  <text x="130" y="80" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666">
    Bio-Inspired Active Context Engine
  </text>
</svg>
