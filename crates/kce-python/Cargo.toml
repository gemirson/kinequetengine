[package]
name = "kce-python"
version = "6.0.0"
edition = "2021"

[lib]
name = "kce_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
kce-core = { workspace = true }
kce-retrieval = { workspace = true }
kce-mce = { workspace = true }
kce-ais = { workspace = true }
kce-metrics = { workspace = true }

[lints]
workspace = true
